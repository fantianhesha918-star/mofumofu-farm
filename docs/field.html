<script>
/* 不具合の原因を見つけやすくする: エラーが出たら画面の上に小さく表示(タップで消える) */
(function () { function show(msg) { try { var d = document.getElementById('errbox'); if (!d) { d = document.createElement('div'); d.id = 'errbox'; d.style.cssText = 'position:fixed;left:6px;right:6px;top:6px;z-index:99999;background:#7a1f1f;color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;max-height:40vh;overflow:auto;white-space:pre-wrap'; d.onclick = function () { d.remove(); }; document.body.appendChild(d); } d.textContent += msg + '\n'; } catch (e) {} }
  addEventListener('error', function (e) { show('ERR ' + (e.message || '') + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
  addEventListener('unhandledrejection', function (e) { show('PROMISE ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); }); })();
</script>

<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="status">
    <div id="portrait"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4-8-1-16 5-15 3 1 4 4 4 7M36 22c4-8 1-16-5-15-3 1-4 4-4 7"/><ellipse cx="24" cy="29" rx="13" ry="11"/><circle cx="19" cy="27" r="1.6" fill="currentColor"/><circle cx="29" cy="27" r="1.6" fill="currentColor"/><path d="M22.5 32h3l-1.5 1.8z" fill="currentColor"/></svg></div>
    <div id="bars">
      <div class="nm">Chino</div>
      <div class="bar"><span id="lvTxt">むらレベル 1</span><i id="lvBar" class="lv"></i></div>
      <div class="meta"><b id="coins">0</b><em id="clock"></em></div>
    </div>
  </div>
  <div id="goal"></div>
  <div id="topbtns">
    <button class="rbtn" id="btnQuest" aria-label="クエスト"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h14a2 2 0 0 1 2 2v18a2 2 0 0 0 2 2H11a3 3 0 0 1-3-3z"/><path d="M12 11h8M12 16h8M12 21h5"/></svg></button>
    <button class="rbtn" id="btnMenu" aria-label="メニュー"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9h20M6 16h20M6 23h20"/></svg></button>
  </div>
  <div id="toasts"></div>
  <div id="itemfeed"></div>
  <div id="mm"><canvas id="mmc" width="320" height="320"></canvas><span class="n">N</span></div>
  <div id="prompt" hidden><span class="key">E</span><div><b></b><small></small></div></div>
  <div id="joyzone"><div id="joybase"><div id="joyarrow"></div><div id="joyknob"></div></div></div>
  <div id="btns">
    <button class="act" id="btnDash" aria-label="ダッシュ"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4 8 18h7l-2 10 11-15h-7z"/></svg><span>ダッシュ</span></button>
    <button class="act big" id="btnAct" aria-label="アクション"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="9"/><path d="M16 11v10M11 16h10"/></svg><span id="actLabel">アクション</span></button>
  </div>
</div>

<div id="panel" hidden><div class="sheet"><header><h2></h2><button id="panelClose" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="body"></div></div></div>
<div id="furnibar" hidden>
  <span class="ft">かぐを ゆびで うごかそう</span>
  <button data-f="shop">かぐ</button><button data-f="rot">まわす</button><button data-f="del">しまう</button><button data-f="done" class="ok">おわり</button>
</div>
<div id="yardbar" hidden>
  <span class="ft">ゆびで うごかす / なにも ないところを ドラッグで 見る場所をかえる</span>
  <button data-y="shop">かざり</button><button data-y="rot">まわす</button><button data-y="del">しまう</button><button data-y="done" class="ok">おわり</button>
</div>
<div id="fade"></div>

<div id="loading2" style="position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#2c1f14;color:#f4ead2;font-size:16px;transition:opacity .5s">よみこみ中...</div>
<style>#loading2.done{opacity:0;pointer-events:none}</style>
